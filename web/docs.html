<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{title}} · hood-oracle docs</title>
  <meta name="description" content="{{description}}" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="{{title}} · hood-oracle" />
  <meta property="og:description" content="{{description}}" />
  <meta name="theme-color" content="#05060c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' rx='4' transform='rotate(45 16 16)' fill='%23cdd2e0'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/src/docs.css" />
</head>
<body class="docs">
  <a class="skip" href="#content">Skip to content</a>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="/" aria-label="hood-oracle home"><i></i>hood-oracle <span class="chain">4663</span></a>
      <nav class="nav lnav" aria-label="Sections">
        <a href="/app">App</a>
        <a href="/docs" class="on">Docs</a>
        <a href="/litepaper">Litepaper</a>
        <a href="https://github.com/nirholas/hood-oracle" rel="noopener">GitHub</a>
      </nav>
      <div class="top-right">
        <button type="button" class="btn sm ghost docs-menu" id="docsMenu" aria-expanded="false" aria-controls="docsSide">Docs menu</button>
        <a class="btn sm primary" href="/app">Open the app</a>
      </div>
    </div>
  </header>
  <div class="docs-wrap">
    <aside class="docs-side" id="docsSide" aria-label="Documentation">
      {{sidebar}}
    </aside>
    <main class="docs-main" id="content">
      <article class="doc" data-slug="{{slug}}">
        {{content}}
      </article>
      <nav class="prevnext" aria-label="Previous and next">
        {{prevnext}}
      </nav>
      <footer class="doc-foot">
        <span>Rendered from <a href="{{source}}" rel="noopener"><code>docs/{{slug}}.md</code></a> at build time. Apache-2.0.</span>
        <span>Scores are probabilities under a model, not promises. Nothing here is financial advice.</span>
      </footer>
    </main>
    <aside class="docs-toc" aria-label="On this page">
      {{toc}}
    </aside>
  </div>
  <script type="module" src="/src/docs.ts"></script>
</body>
</html>
