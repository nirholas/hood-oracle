services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hood
      POSTGRES_PASSWORD: hood
      POSTGRES_DB: hood_oracle
    ports:
      - "5432:5432"
    volumes:
      - hood_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hood -d hood_oracle"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://hood:hood@db:5432/hood_oracle
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  hood_pg:
